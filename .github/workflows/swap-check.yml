name: Swap environment check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect host memory/disk
        run: |
          echo "=== free -h (host) ==="
          free -h
          echo "=== df / ==="
          df -h /
          echo "=== sudo available ==="
          sudo -n true && echo "passwordless sudo OK"

      - name: Add swap on the host
        run: |
          sudo rm -f /ci.swap
          sudo fallocate -l 14G /ci.swap
          sudo chmod 600 /ci.swap
          sudo mkswap /ci.swap >/dev/null
          sudo swapon /ci.swap
          echo "=== free -h after swapon ==="
          free -h

      - name: Stress-test inside an arch container (no container: block)
        run: |
          # docker is available on the ubuntu host runner; the container
          # inherits the host's memory + swap
          docker run --rm archlinux:base-devel sh -c '
            echo "=== free -h in container ==="
            free -h
            python3 - <<PYEOF
            import time
            chunk = 256 * 1024 * 1024
            bufs = []
            try:
                while True:
                    bufs.append(bytearray(chunk))
                    print(f"allocated {len(bufs)*256} MB", flush=True)
            except MemoryError:
                print("MemoryError at", len(bufs)*256, "MB")
            except OSError as e:
                print("OSError:", e)
            time.sleep(2)
            PYEOF
            echo "container stress done"
          '
