name: Build DevEco Studio PKGBUILD

on:
  workflow_dispatch:
    inputs:
      mac_zip_url:
        description: URL to the Mac zip (devecostudio-mac-<ver>.zip)
        required: true
      cli_zip_url:
        description: URL to commandline-tools-linux-x64-<ver>.zip
        required: true
      pkgver:
        description: 'Override pkgver (e.g. 6.1.1.280). Leave empty to use the value in PKGBUILD.'
        required: false
        default: ''
      mac_zip_sha256:
        description: 'SHA256 of the Mac zip. Leave empty to use the value in PKGBUILD.'
        required: false
        default: ''
      cli_zip_sha256:
        description: 'SHA256 of the commandline-tools zip. Leave empty to use the value in PKGBUILD.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: devecostudio

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            git \
            jq \
            p7zip \
            sudo \
            dpkg  # dpkg-deb, used to produce a .deb for Debian/Ubuntu

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder devecostudio

      - name: Apply version and checksum overrides
        working-directory: devecostudio
        run: |
          if [[ -n "${{ inputs.pkgver }}" ]]; then
            sed -i "s/^pkgver=.*/pkgver=${{ inputs.pkgver }}/" PKGBUILD
            echo "pkgver overridden to ${{ inputs.pkgver }}"
          fi
          # sha256sums array line numbers: mac zip is the 1st entry, cli zip the 2nd
          line=$(grep -n "^sha256sums=(" PKGBUILD | cut -d: -f1)
          if [[ -n "${{ inputs.mac_zip_sha256 }}" ]]; then
            sed -i "$((line+1))s|.*|  '${{ inputs.mac_zip_sha256 }}'|" PKGBUILD
            echo "mac zip sha256 overridden"
          fi
          if [[ -n "${{ inputs.cli_zip_sha256 }}" ]]; then
            sed -i "$((line+2))s|.*|  '${{ inputs.cli_zip_sha256 }}'|" PKGBUILD
            echo "cli zip sha256 overridden"
          fi

      - name: Download source archives
        working-directory: devecostudio
        run: |
          curl -fL \
            -o devecostudio-mac.zip \
            "${{ inputs.mac_zip_url }}" &

          curl -fL \
            -o commandline-tools-linux-x64.zip \
            "${{ inputs.cli_zip_url }}" &

          wait

      - name: Build package
        run: |
          runuser -u builder -- bash -c '
            cd devecostudio
            makepkg -sfc --noconfirm
          '

      - name: Build .deb and tarball for other distributions
        working-directory: devecostudio
        run: |
          # makepkg already produced pkg/ (the staged tree). build.sh --stage
          # emits both the Debian package and the distro-agnostic tarball from
          # it without re-running the Arch build.
          ./build.sh --stage pkg -d -o .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: devecostudio-pkg
          path: |
            devecostudio/*.pkg.tar.zst
            devecostudio/devecostudio_*.deb
            devecostudio/devecostudio-*-linux-x86_64.tar.gz
