name: Build DevEco Studio PKGBUILD

on:
  workflow_dispatch:
    inputs:
      mac_zip_url:
        description: URL to the Mac zip (devecostudio-mac-<ver>.zip)
        required: true
      cli_zip_url:
        description: URL to commandline-tools-linux-x64-<ver>.zip
        required: true
      pkgver:
        description: 'Override pkgver (e.g. 6.1.1.280). Leave empty to use the value in PKGBUILD.'
        required: false
        default: ''
      mac_zip_sha256:
        description: 'SHA256 of the Mac zip. Leave empty to use the value in PKGBUILD.'
        required: false
        default: ''
      cli_zip_sha256:
        description: 'SHA256 of the commandline-tools zip. Leave empty to use the value in PKGBUILD.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: devecostudio

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            git \
            jq \
            p7zip \
            sudo

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder devecostudio

      - name: Apply version and checksum overrides
        working-directory: devecostudio
        run: |
          if [[ -n "${{ inputs.pkgver }}" ]]; then
            sed -i "s/^pkgver=.*/pkgver=${{ inputs.pkgver }}/" PKGBUILD
            echo "pkgver overridden to ${{ inputs.pkgver }}"
          fi
          # sha256sums array line numbers: mac zip is the 1st entry, cli zip the 2nd
          line=$(grep -n "^sha256sums=(" PKGBUILD | cut -d: -f1)
          if [[ -n "${{ inputs.mac_zip_sha256 }}" ]]; then
            sed -i "$((line+1))s|.*|  '${{ inputs.mac_zip_sha256 }}'|" PKGBUILD
            echo "mac zip sha256 overridden"
          fi
          if [[ -n "${{ inputs.cli_zip_sha256 }}" ]]; then
            sed -i "$((line+2))s|.*|  '${{ inputs.cli_zip_sha256 }}'|" PKGBUILD
            echo "cli zip sha256 overridden"
          fi

      - name: Download source archives
        working-directory: devecostudio
        run: |
          curl -fL \
            -o devecostudio-mac.zip \
            "${{ inputs.mac_zip_url }}" &

          curl -fL \
            -o commandline-tools-linux-x64.zip \
            "${{ inputs.cli_zip_url }}" &

          wait

      - name: Build package
        run: |
          runuser -u builder -- bash -c '
            cd devecostudio
            # no -c: makepkg --clean removes pkg/, which the packaging step
            # below needs (build.sh --stage reads the staging tree)
            makepkg -sf --noconfirm
          '

      - name: Build .deb, .rpm and tarball with build.sh
        working-directory: devecostudio
        run: |
          # nfpm is not in the Arch repos; fetch the static binary from the
          # GitHub release (pinned version; update deliberately).
          curl -fL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz \
            | tar xz -C /usr/local/bin nfpm
          nfpm --version | head -1
          if [[ -d pkg/devecostudio ]]; then
            # --stage packages the existing makepkg tree: it always emits
            # the distro-agnostic tarball, and --deb/--rpm add the nfpm
            # packages — no duplicate tar step needed.
            ./build.sh --stage=pkg/devecostudio --deb --rpm
          else
            echo "pkg/devecostudio not found; skipping packages"
          fi

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: devecostudio-arch
          path: devecostudio/*.pkg.tar.zst
          if-no-files-found: warn

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: devecostudio-deb
          path: devecostudio/devecostudio_*.deb
          if-no-files-found: warn

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: devecostudio-rpm
          path: devecostudio/devecostudio-*.x86_64.rpm
          if-no-files-found: warn

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: devecostudio-tarball
          path: devecostudio/devecostudio-*-linux-x86_64.tar.gz
          if-no-files-found: warn
